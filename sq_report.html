<title>SQ予測レポート 日経225オプション</title>
<style>
  :root{
    --bg:#0c0f16; --bg-elevated:#12161f; --card:#161b26; --card-border:#232937;
    --text:#e7eaf0; --text-dim:#8993a4; --text-faint:#5b6472;
    --up:#2fd480; --up-bg:rgba(47,212,128,0.14);
    --down:#ff5d6c; --down-bg:rgba(255,93,108,0.14);
    --accent:#4d8dff; --accent-soft:rgba(77,141,255,0.15);
    --warn:#f5b942; --warn-bg:rgba(245,185,66,0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px;margin:0 auto;padding:20px 16px 96px;}
  header.top{border-bottom:1px solid var(--card-border);padding-bottom:14px;margin-bottom:20px;}
  header.top h1{font-size:19px;font-weight:700;margin:0 0 8px;letter-spacing:.02em;}
  header.top .line{font-size:12.5px;color:var(--text-dim);line-height:1.7;}
  header.top .gen{font-size:11.5px;color:var(--text-faint);margin-top:6px;}
  header.top .fresh{margin-top:10px;font-size:12px;line-height:1.7;padding:8px 11px;
    border-left:3px solid var(--accent);background:var(--accent-soft);
    color:var(--text-dim);border-radius:0 4px 4px 0;}
  header.top .fresh.late{border-left-color:var(--warn);background:var(--warn-bg);}
  header.top .fresh b{color:var(--text);font-weight:600;}
  header.top .fresh .why{display:block;margin-top:3px;font-size:11.5px;color:var(--text-dim);}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
    background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px;}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}

  h2{font-size:15px;margin:34px 0 12px;padding-left:9px;border-left:3px solid var(--accent);}
  h3{font-size:13px;margin:22px 0 8px;color:var(--text-dim);font-weight:600;}
  p.note{font-size:12.5px;color:var(--text-dim);line-height:1.8;margin:8px 0;}

  .card{background:var(--card);border:1px solid var(--card-border);border-radius:10px;
    padding:14px 16px;margin-bottom:12px;}
  .disc{border-left:3px solid var(--warn);background:var(--warn-bg);}
  .disc.ok{border-left-color:var(--up);background:var(--up-bg);}
  .disc .t{font-size:13px;font-weight:600;margin-bottom:6px;}
  .disc .b{font-size:12.5px;color:var(--text-dim);line-height:1.8;}

  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:min-content;}
  th,td{padding:7px 10px;text-align:right;white-space:nowrap;
    border-bottom:1px solid var(--card-border);}
  th{color:var(--text-faint);font-weight:600;font-size:11.5px;text-align:right;
    background:var(--bg-elevated);position:sticky;top:0;}
  th:first-child,td:first-child{text-align:left;}
  td.txt,th.txt{text-align:left;white-space:normal;min-width:200px;color:var(--text-dim);}
  tr:last-child td{border-bottom:none;}
  .up{color:var(--up);} .down{color:var(--down);} .dim{color:var(--text-faint);}
  .star{color:var(--warn);}

  .kv{display:grid;grid-template-columns:132px 1fr;gap:2px 14px;font-size:13px;line-height:1.85;}
  .kv .k{color:var(--text-faint);font-size:12px;padding-top:2px;}
  .kv .v{color:var(--text);}

  .gex{font-size:12px;}
  .gex .row{display:grid;grid-template-columns:64px 1fr 88px;align-items:center;gap:8px;
    padding:2px 0;}
  .gex .lv{color:var(--text-dim);text-align:right;}
  .gex .bar{position:relative;height:14px;background:var(--bg-elevated);border-radius:3px;}
  .gex .bar i{position:absolute;top:0;bottom:0;border-radius:3px;}
  .gex .bar i.pos{background:var(--up);} .gex .bar i.neg{background:var(--down);}
  .gex .bar .mid{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--text-faint);}
  .gex .val{text-align:right;color:var(--text-dim);}
  .gex .row.flip .lv{color:var(--warn);font-weight:700;}

  /* ひとことまとめ */
  .sum{background:var(--card);border:1px solid var(--card-border);border-radius:10px;
    padding:16px 18px;margin-bottom:14px;}
  .sum .head{display:flex;align-items:baseline;justify-content:space-between;
    flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .sum .state{font-size:17px;font-weight:700;}
  .sum .state.warn{color:var(--warn);} .sum .state.ok{color:var(--up);}
  .sum .cd{font-size:12px;color:var(--text-faint);}
  .sum .sub{font-size:12.5px;color:var(--text-dim);line-height:1.7;margin-bottom:14px;}
  .sum ul{list-style:none;padding:0;margin:0;font-size:13px;line-height:1.85;}
  .sum ul li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:2px 0;}
  .sum ul li b{color:var(--text-faint);font-size:12px;font-weight:600;padding-top:2px;}
  .sum .note{font-size:12px;color:var(--text-faint);line-height:1.75;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--card-border);}

  /* 価格のはしご図。ゾーンは色だけでなく文字でも示す（色覚に依存させない） */
  .ladder{position:relative;height:210px;margin:6px 0 16px;}
  .ladder .zone{position:absolute;left:96px;right:0;border-radius:4px;}
  .ladder .zone.calm{background:rgba(47,212,128,0.10);}
  .ladder .zone.amp{background:rgba(255,93,108,0.10);}
  .ladder-legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:-6px 0 14px 96px;
    font-size:11.5px;color:var(--text-faint);}
  .ladder-legend span{display:inline-flex;align-items:center;gap:6px;}
  .ladder-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .ladder-legend i.calm{background:rgba(47,212,128,0.45);}
  .ladder-legend i.amp{background:rgba(255,93,108,0.45);}
  .ladder-legend em{font-style:normal;}
  .ladder .lv{position:absolute;left:0;right:0;transform:translateY(-50%);
    display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;}
  .ladder .lv .px{text-align:right;font-size:12.5px;color:var(--text-dim);
    font-variant-numeric:tabular-nums;}
  /* 壁の線。--card-border は帯の色に沈んで見えなくなるので使わない */
  .ladder .lv .bar{position:relative;height:0;border-top:1px dashed var(--text-faint);}
  .ladder .lv .bar b{position:absolute;left:6px;top:-9px;font-size:11.5px;
    font-weight:600;color:var(--text-dim);background:var(--card);padding:0 5px;}
  .ladder .lv.flip .bar{border-top:2px solid var(--warn);}
  .ladder .lv.flip .px, .ladder .lv.flip .bar b{color:var(--warn);}
  .ladder .lv.now .bar{border-top:2px solid var(--accent);}
  .ladder .lv.now .px{color:var(--text);font-weight:700;}
  .ladder .lv.now .bar b{color:var(--accent);}
  .ladder .lv.now .bar:after{content:"";position:absolute;left:0;top:-4px;
    width:8px;height:8px;border-radius:50%;background:var(--accent);}
  /* 印刷・PDF: 1ページ目をまとめ、2ページ目以降を詳細にする。
     画面は暗い配色なので、紙では明るい配色に入れ替える。 */
  @media print{
    :root{
      --bg:#fff; --bg-elevated:#f4f6f9; --card:#fff; --card-border:#c9d0da;
      --text:#111418; --text-dim:#3d4552; --text-faint:#6b7482;
      --up:#0a7a45; --down:#c0203a; --accent:#1449a8; --warn:#8a6100;
      --up-bg:rgba(10,122,69,0.10); --down-bg:rgba(192,32,58,0.10);
      --warn-bg:rgba(138,97,0,0.10); --accent-soft:rgba(20,73,168,0.10);
    }
    @page{margin:14mm 12mm;}
    body{background:#fff;}
    .app{max-width:none;padding:0;}
    .page1{break-after:page;}
    .more{display:none;}
    h2{break-after:avoid;}
    h3{break-after:avoid;}
    .card,.sum,.tw,table{break-inside:avoid;}
    table{font-size:9pt;}
    th{position:static;}
    .ladder .lv .bar b{background:#fff;}
    footer{break-inside:avoid;}
  }

  @media (max-width:640px){
    .sum ul li{grid-template-columns:1fr;gap:0;}
    .sum ul li b{padding-top:8px;}
    .ladder .zone{left:78px;}
    .ladder .lv{grid-template-columns:70px 1fr;}
    .ladder-legend{margin-left:0;}
  }

  .more{margin:18px 0 26px;padding-top:14px;border-top:1px solid var(--card-border);
    font-size:12px;color:var(--text-faint);text-align:center;letter-spacing:.04em;}

  ol.limits{font-size:12.5px;color:var(--text-dim);line-height:1.9;padding-left:22px;margin:6px 0;}
  ol.limits li{margin-bottom:5px;}
  .watch li{margin-bottom:12px;}
  .watch .lbl{font-size:13px;color:var(--text);font-weight:600;}
  .watch .rule{font-size:12.5px;color:var(--text-dim);line-height:1.8;margin-top:3px;}
  .empty{font-size:12.5px;color:var(--text-faint);padding:10px 0;}
  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--card-border);
    font-size:11.5px;color:var(--text-faint);line-height:1.9;}
  footer a{color:var(--accent);text-decoration:none;}
  @media (max-width:640px){
    .kv{grid-template-columns:1fr;gap:0 0;}
    .kv .k{padding-top:8px;}
    .gex .row{grid-template-columns:56px 1fr 74px;}
  }

const $ = (tag, cls, text) => {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined && text !== null) el.textContent = text;
  return el;
};

/* 増減の符号で色を付ける。数値以外はそのまま返す。 */
function signClass(v){
  if (typeof v !== 'string') return '';
  if (/^\+/.test(v) && !/^\+0(\.0+)?$/.test(v)) return 'up';
  if (/^-/.test(v) && !/^-0(\.0+)?$/.test(v)) return 'down';
  return '';
}

function table(cols, rows){
  const wrap = $('div','tw');
  const t = $('table');
  const thead = $('thead'), tr = $('tr');
  cols.forEach(c => {
    const th = $('th', c.txt ? 'txt' : '', c.label);
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = $('tbody');
  rows.forEach(r => {
    const row = $('tr');
    cols.forEach(c => {
      const raw = r[c.key];
      const td = $('td', c.txt ? 'txt' : '', raw === undefined || raw === null ? '—' : String(raw));
      if (c.sign){
        const sc = signClass(String(raw));
        if (sc) td.classList.add(sc);
      }
      if (c.dim) td.classList.add('dim');
      row.appendChild(td);
    });
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}

function section(title){ return $('h2', null, title); }

/* 価格のはしご図。
   上下のゾーンは色だけでなく文字でも示す。赤と緑は色覚多様性で見分けが
   つきにくく（検証で ΔE 6.3）、色に意味を担わせられないため。
   水準が近接するとラベルが重なるので、最小間隔を確保して押し広げる。
   その分だけ位置は厳密でなくなるので、正確な数値は各行に併記する。 */
function ladder(su){
  const box = $('div','ladder');
  const levels = (su.levels || []).filter(l => typeof l.value === 'number');
  if (!levels.length) return box;

  const H = 210, MIN_GAP = 30;
  const vals = levels.map(l => l.value);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  const pad = Math.max((hi - lo) * 0.12, 1);
  const top = hi + pad, bottom = lo - pad;
  const rawPx = v => (top - v) / (top - bottom) * H;

  // 上から順に、最小間隔を満たすまで下へ押す → はみ出したぶんを上へ押し返す
  const items = levels.map(l => ({...l, y: rawPx(l.value)}))
                      .sort((a, b) => a.y - b.y);
  for (let i = 1; i < items.length; i++){
    items[i].y = Math.max(items[i].y, items[i - 1].y + MIN_GAP);
  }
  const overflow = items[items.length - 1].y - (H - 6);
  if (overflow > 0){
    for (let i = items.length - 1; i >= 0; i--){
      items[i].y -= overflow;
      if (i > 0) items[i - 1].y = Math.min(items[i - 1].y, items[i].y - MIN_GAP);
    }
  }
  items.forEach(it => { it.y = Math.max(6, Math.min(H - 6, it.y)); });

  // ゾーンの境目は、描画した切替ラインの位置に合わせる
  const flipItem = items.find(it => it.key === 'flip');
  if (flipItem){
    const fp = flipItem.y / H * 100;
    const zones = [['calm', 0, fp], ['amp', fp, 100]];
    zones.forEach(([cls, from, to]) => {
      const z = $('div','zone ' + cls);
      z.style.top = from + '%';
      z.style.height = (to - from) + '%';
      box.appendChild(z);
    });
  }

  items.forEach(l => {
    const row = $('div','lv ' + (l.key === 'now' ? 'now' : (l.key === 'flip' ? 'flip' : '')));
    row.style.top = l.y + 'px';
    row.appendChild($('div','px', l.display));
    const bar = $('div','bar');
    bar.appendChild($('b', null, l.label));
    row.appendChild(bar);
    box.appendChild(row);
  });

  // 凡例は帯の外に出す。帯が薄いと中の文字が消えてしまうため。
  const wrap = $('div');
  wrap.appendChild(box);
  if (flipItem){
    const lg = $('div','ladder-legend');
    [['calm', '切替ラインより上 → 値動きが収まりやすい'],
     ['amp', '切替ラインより下 → 値動きが増幅されやすい']].forEach(([cls, text]) => {
      const item = $('span');
      item.appendChild($('i', cls));
      item.appendChild($('em', null, text));
      lg.appendChild(item);
    });
    wrap.appendChild(lg);
  }
  return wrap;
}

function kv(pairs){
  const box = $('div','card');
  const grid = $('div','kv');
  pairs.forEach(([k,v]) => {
    if (v === undefined || v === null || v === '') return;
    grid.appendChild($('div','k',k));
    grid.appendChild($('div','v',v));
  });
  box.appendChild(grid);
  return box;
}

function gexChart(profile, flipLabel){
  const box = $('div','card');
  const wrap = $('div','gex');
  const vals = profile.map(p => Math.abs(parseFloat(String(p.gex).replace(/[+,]/g,''))) || 0);
  const max = Math.max(...vals, 1);
  profile.forEach(p => {
    const v = parseFloat(String(p.gex).replace(/[+,]/g,'')) || 0;
    const row = $('div','row' + (p.level === flipLabel ? ' flip' : ''));
    row.appendChild($('div','lv', p.level));
    const bar = $('div','bar');
    const i = $('i', v >= 0 ? 'pos' : 'neg');
    const w = Math.abs(v)/max*50;
    if (v >= 0){ i.style.left = '50%'; i.style.width = w + '%'; }
    else { i.style.right = '50%'; i.style.width = w + '%'; }
    bar.appendChild(i);
    const mid = $('div','mid'); mid.style.left = '50%'; bar.appendChild(mid);
    row.appendChild(bar);
    row.appendChild($('div','val', p.gex + '億'));
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
  return box;
}

/* 「まだ新しいデータが無い」のか「更新が止まっている」のかを読者が区別できるようにする。
   大阪取引所の日報は翌営業日にしか公開されないので、レポートは常に1営業日遅れになる。
   next_update_at はビルド時に基準日から算出済み（基準日が変わらない限り値も変わらないので、
   この表示のために毎回の実行で差分が出ることはない）。*/
const LATE_GRACE_MS = 12 * 3600 * 1000;   /* 定期実行は数時間ずれることがある */

function freshness(m){
  if (!m.next_update_at) return null;
  const due = Date.parse(m.next_update_at);
  if (isNaN(due)) return null;
  const late = Date.now() > due + LATE_GRACE_MS;
  const el = $('div', 'fresh' + (late ? ' late' : ''));
  el.appendChild($('b', null, late ? '⚠ 更新が遅れています' : '✓ これが最新のデータです'));
  el.appendChild(document.createTextNode(late
    ? `　${m.next_update_label} に ${m.next_board_label} の板へ更新される予定でした。`
    : `　次の更新は ${m.next_update_label}（${m.next_board_label} の板を反映）。`));
  el.appendChild($('span', 'why',
    '大阪取引所の日報は当日には公開されず翌営業日に出るため、本レポートは常に1営業日遅れです。'
    + '土日・祝日は板が立たないので更新もありません。'));
  return el;
}

    if (mt.per_month && mt.per_month.length){
      app.appendChild($('h3',null,'限月別合計'));
      app.appendChild($('p','note','限月別合計は捕捉窓の影響を受ける。前日比の判断には共通窓の表を使う。'));
      app.appendChild(table([
        {key:'month', label:'限月'}, {key:'call', label:'CALL'},
        {key:'put', label:'PUT'}, {key:'pcr', label:'PCR'},
      ], mt.per_month));
    }
    if (mt.upper && mt.upper.length){
      app.appendChild($('h3',null,'ネット建玉（CALL − PUT）の上位'));
      app.appendChild(table([
        {key:'strike', label:'上方（CALL優勢）'}, {key:'net', label:'net', sign:true},
      ], mt.upper));
      app.appendChild(table([
        {key:'strike', label:'下方（PUT優勢）'}, {key:'net', label:'net', sign:true},
      ], mt.lower));
    }
  }

  /* ---- 参加者別ネット建玉 ---- */
  if (d.participants && d.participants.available){
    const p = d.participants;
    app.appendChild(section('取引参加者別ネット建玉（週次）'));
    app.appendChild($('p','note',
      `${p.as_of} 時点（本レポートの基準日の ${p.lag_days}日前）／` +
      `対象 ${(p.products||[]).join('・')}／限月 ${(p.months||[]).join('・')}／` +
      `合計 ${p.total}枚（ラージ換算）` +
      (p.prev_as_of && p.prev_as_of !== '—' ? `／前週は ${p.prev_as_of} 時点` : '')));
    const warn = $('div','card disc');
    warn.appendChild($('div','t','⚠ このデータで分かること・分からないこと'));
    warn.appendChild($('div','b',
      '証券会社単位の建玉であり、その先の顧客が誰かは分からない（自己玉と顧客玉が混在する）。' +
      '売超・買超それぞれ上位15社のみで、市場全体の集計ではない。' +
      '週次公表のため、日次のレポートに対して常に時間差がある。' +
      'ミニは1/10、マイクロは1/100でラージ換算している。'));
    app.appendChild(warn);
    if (p.stale){
      const st = $('div','card disc');
      st.appendChild($('div','t',`⚠ ${p.lag_days}日前のデータ`));
      st.appendChild($('div','b',
        'この間の値動きで誰がどう動いたかは、次回の公表を待つまで検証できない。'));
      app.appendChild(st);
    }
    app.appendChild(table([
      {key:'name', label:'参加者'},
      {key:'side', label:'向き'},
      {key:'before', label:'前週', sign:true},
      {key:'net', label:'ネット建玉', sign:true},
      {key:'change', label:'前週比', sign:true},
      {key:'breakdown', label:'商品別の内訳', txt:true},
    ], p.rows));
  } else if (d.participants){
    app.appendChild(section('取引参加者別ネット建玉（週次）'));
    app.appendChild($('div','empty', d.participants.note || '取得できませんでした。'));
  }

  /* ---- イベント ---- */
  if (d.events && d.events.length){
    app.appendChild(section('SQまでの日程'));
    app.appendChild($('p','note','これは日程表であって、値動きの原因ではない。'));
    app.appendChild(table([
      {key:'date', label:'日付'}, {key:'name', label:'イベント', txt:true},
      {key:'note', label:'備考', txt:true}, {key:'after_sq', label:''},
    ], d.events));
  }

  /* ---- 監視ポイント ---- */
  if (d.watch && d.watch.length){
    app.appendChild(section('明日以降の監視ポイント'));
    app.appendChild($('p','note',
      '閾値は現値移動に汚染されない正規化された量で置く。ここに載せた項目は翌日そのまま自動で答え合わせされる。'));
    const box = $('div','card');
    const ol = $('ol','watch');
    d.watch.forEach(x => {
      const li = $('li');
      const lbl = $('div','lbl', (x.star ? '★ ' : '') + x.label);
      if (x.star) lbl.classList.add('star');
      li.appendChild(lbl);
      li.appendChild($('div','rule', x.rule));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    app.appendChild(box);
  }

  /* ---- 答え合わせ ---- */
  app.appendChild(section('前回比・答え合わせ'));
  if (d.answer_check && d.answer_check.length){
    app.appendChild(table([
      {key:'label', label:'前日に設定した監視項目', txt:true},
      {key:'before', label:'前日'}, {key:'now', label:'当日'},
      {key:'diff', label:'変化', sign:true},
      {key:'verdict', label:'判定', txt:true},
    ], d.answer_check));
  } else {
    app.appendChild($('div','empty',
      '前日の監視ポイントがまだ無いため、答え合わせは次回の更新から表示されます。'));
  }

  /* ---- 前提と限界 ---- */
  if (d.limits && d.limits.length){
    app.appendChild(section('前提と限界'));
    const box = $('div','card');
    const ol = $('ol','limits');
    d.limits.forEach(x => ol.appendChild($('li',null,x)));
    box.appendChild(ol);
    app.appendChild(box);
  }

  const f = $('footer');
  f.appendChild($('div',null,
    '本レポートは日経225オプションの建玉スナップショットに基づく構造分析であり、投資勧誘・売買推奨ではありません。'));
  if (m.sources && m.sources.length){
    f.appendChild($('div',null,'出所: ' + m.sources.join(' ／ ')));
  }
  const link = $('div');
  const a = $('a',null,'米国株マーケットダッシュボードへ');
  a.href = 'index.html';
  link.appendChild(a);
  f.appendChild(link);
  app.appendChild(f);
}

render(SQ_DATA);
</script>
</body>
</html>
