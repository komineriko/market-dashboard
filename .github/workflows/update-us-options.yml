name: Update US options screening

on:
  schedule:
    # 火〜土 09:00 UTC = 前日の立会日の分。日本時間では 18:00。
    #
    # 引けの直後に回すと日足の配信が間に合わない。実測で、引け（16:00 ET）の
    # 4時間45分後でも yfinance の日足は前日分までしか来ていなかった。
    # 一方で板はもう引け値で出ているため、そのまま走らせると日足と板で
    # 1営業日ずれる。12時間以上あけて両方そろってから回す。
    # 18:00 JST は米国の寄り付きの数時間前なので、見る側にも都合がよい。
    - cron: "0 9 * * 2-6"
  workflow_dispatch:
    inputs:
      limit:
        description: "ユニバースの先頭N銘柄だけ処理する（動作確認用）"
        required: false
      date:
        description: "基準日 (YYYY-MM-DD)。空なら日足の最終日"
        required: false
      snapshot:
        description: "yes にすると取得した板をアーティファクトとして残す"
        required: false

permissions:
  contents: write

concurrency:
  group: update-us-options
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # テストはリポジトリ全体を回すので、日経225側が使う openpyxl /
        # pdfplumber も要る。足りないとテストが import で落ちる。
        run: pip install requests yfinance openpyxl pdfplumber

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build report
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.snapshot }}" = "yes" ]; then
            ARGS="$ARGS --snapshot us_chain_snapshot.json"
          fi
          python update_us_options.py $ARGS

      - name: Upload snapshot
        if: ${{ github.event.inputs.snapshot == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: us-chain-snapshot
          path: us_chain_snapshot.json
          retention-days: 3

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain us_options.html)" ]; then
            echo "変更なし。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_options.html
          git commit -m "chore: 米国株オプション自動更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i))
            git pull --rebase || true
          done
          git push
